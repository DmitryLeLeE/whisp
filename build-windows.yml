name: Build WhisperSRT for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows CPU EXE
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python (only on the cloud runner)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install CPU PyTorch
        shell: pwsh
        run: python -m pip install --upgrade pip setuptools wheel; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; python -m pip install torch --index-url https://download.pytorch.org/whl/cpu; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install application dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-essentials.zip'
          $extractDir = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $zipPath
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $ffmpeg = Get-ChildItem $extractDir -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $extractDir -Filter 'ffprobe.exe' -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'ffmpeg.exe or ffprobe.exe was not found in the downloaded archive.' }
          New-Item -ItemType Directory -Force -Path 'ffmpeg_bin' | Out-Null
          Copy-Item $ffmpeg.FullName 'ffmpeg_bin\ffmpeg.exe' -Force
          Copy-Item $ffprobe.FullName 'ffmpeg_bin\ffprobe.exe' -Force

      - name: Build the one-file EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name WhisperSRT `
            --collect-all torch `
            --collect-all whisper `
            --collect-all tiktoken `
            --collect-all numba `
            --hidden-import tiktoken_ext `
            --hidden-import tiktoken_ext.openai_public `
            --add-binary 'ffmpeg_bin\ffmpeg.exe;ffmpeg_bin' `
            --add-binary 'ffmpeg_bin\ffprobe.exe;ffmpeg_bin' `
            WhisperSRT_GUI.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist\WhisperSRT.exe')) { throw 'Build finished without dist\WhisperSRT.exe' }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: WhisperSRT-Windows-CPU
          path: dist/WhisperSRT.exe
          if-no-files-found: error
          retention-days: 7
